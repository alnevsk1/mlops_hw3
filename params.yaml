# Единственная точка конфигурации ДЗ 3.
# Ни один путь, порог или размер среза не должен появляться в коде строкой.

fetch:
  # Выгрузка из GitHub REST API. НЕ стадия dvc: сеть недетерминирована, и
  # `dvc repro` завтра вернул бы другой набор коммитов. Скрипт складывает
  # сырые ответы API в sources/*.jsonl, а стадия collect читает только их.
  # Кэш версионируется отдельно: `dvc add sources` — каталог лежит вне data/,
  # потому что data/ целиком в .gitignore, и файл-указатель sources.dvc
  # оттуда в git бы не попал.
  dir: "sources"
  repos:                     # соблюдают Conventional Commits в истории
    - "angular/angular"
    - "nestjs/nest"
    - "vuejs/core"
    - "prisma/orm"          # бывший prisma/prisma: переименован в 2025-м
    - "nuxt/nuxt"
    - "vitejs/vite"
  per_page: 100              # максимум, который отдаёт /repos/{repo}/commits
  list_pages: 10             # до 1000 коммитов на репозиторий в листинге
  max_detail: 500            # запросов за списком файлов на репозиторий.
                             # Это и есть расход лимита: 6 × 500 + листинг
                             # укладывается в 5000 запросов в час с токеном.
  workers: 8                 # параллельных запросов: один идёт ~2 с, и почти
                             # всё это время — ожидание сети. Выше 8 GitHub
                             # начинает отвечать вторичным лимитом.
  max_files_cached: 30       # сколько путей хранить в кэше (в датасет идёт
                             # collect.max_files, запас — чтобы не ходить дважды)

collect:
  # Версия датасета переключается ЗДЕСЬ. Всё остальное — следствие.
  version: "v2"              # v1 | v2
  n_rows: 3000               # потолок строк в raw.jsonl ПОСЛЕ всех фильтров
  sources:
    # v1 — четыре репозитория, v2 — те же плюс два новых. Версии отличаются
    # не только объёмом, но и числом групп сплита: у каждого проекта свой
    # стиль сообщений, и новая группа — это новый стиль, а не ещё строки.
    v1:
      - "sources/angular__angular.jsonl"
      - "sources/nestjs__nest.jsonl"
      - "sources/vuejs__core.jsonl"
      - "sources/prisma__orm.jsonl"
    v2:
      - "sources/angular__angular.jsonl"
      - "sources/nestjs__nest.jsonl"
      - "sources/vuejs__core.jsonl"
      - "sources/prisma__orm.jsonl"
      - "sources/nuxt__nuxt.jsonl"
      - "sources/vitejs__vite.jsonl"

  # --- Переработка источника ---
  # Сырой листинг API — это сырьё, а не сдача (см. README, «Готовый датасет
  # как источник»). Параметры ниже — то, чем датасет отличается от «выгрузил
  # коммиты и переименовал в raw.jsonl». Каждый обязан быть отражён
  # в docs/datasheet.md, и каждый виден числом в metrics/collect.json.

  types:                     # шесть классов задачи; заголовок другого типа
                             # (perf, style, ci, build, chore(deps)) выбрасывается,
    - "feat"                 # а не сворачивается в соседний класс: чужую
    - "fix"                  # разметку не додумываем.
    - "docs"
    - "refactor"
    - "test"
    - "chore"

  drop_merges: true          # merge-коммит — не авторский текст, а склейка
  drop_bots: true            # dependabot/renovate пишут по шаблону
  drop_reverts: true         # «Revert "feat(x): ..."» содержит чужой префикс
  drop_release: true         # `chore(release): 1.2.3` — бамп версии, не язык

  max_files: 10              # путей со статистикой во входе примера
  max_body_chars: 1200       # тело сообщения длиннее обрезается по строке:
                             # иначе пример вылетает по clean.max_user_chars
  max_per_class_per_repo: 150  # потолок на класс ВНУТРИ репозитория. Именно
                             # внутри: общий потолок на весь набор выбирался бы
                             # в порядке файлов, и последнему репозиторию не
                             # досталось бы частых классов совсем (факт до
                             # правки: у prisma/orm было 0 коммитов fix).
                             # Репозиторий — это группа сплита, так что перекос
                             # уехал бы прямо в test и в macro-F1.
  max_per_repo: 500          # потолок на репозиторий = на группу сплита.
                             # Связан с diversity.max_group_share напрямую.

  system_prompts:            # Инструкция разведена на варианты; вариант
                             # выбирается детерминированно по id примера.
                             # Модель, обученная на одной формулировке,
                             # заучивает её как константу и ломается от перефраза.
    - "You classify git commits by Conventional Commits type. Given the commit message (prefix removed) and the list of changed files, answer with a JSON object: {\"type\": one of feat|fix|docs|refactor|test|chore, \"breaking\": true or false}. Answer with JSON only."
    - "Определи тип коммита по соглашению Conventional Commits. На входе — сообщение без префикса и список изменённых файлов. Ответь ровно одним JSON-объектом с полями type (feat, fix, docs, refactor, test или chore) и breaking (true или false). Ничего, кроме JSON."
    - "Task: commit type classification. You get a commit message with its type prefix stripped, plus changed files with line statistics. Return only JSON: {\"type\": \"...\", \"breaking\": ...}. Allowed types: feat, fix, docs, refactor, test, chore."
    - "Ты размечаешь историю репозитория. По тексту коммита и списку файлов выбери один тип из feat, fix, docs, refactor, test, chore и укажи, является ли изменение breaking change. Формат ответа — JSON с ключами type и breaking, без пояснений."
    - "Read the commit message and the changed files, then decide which Conventional Commits type it belongs to and whether it breaks the public API. Reply with a single JSON object {\"type\": ..., \"breaking\": ...} and nothing else."

clean:
  # Фильтр длин: слишком короткий пример — обрезок, слишком длинный — выброс.
  min_user_chars: 30
  max_user_chars: 4000
  min_assistant_chars: 2
  near_dup:
    enabled: true
    shingle_words: 4         # длина словного шингла
    num_perm: 64             # перестановок MinHash: точность против скорости
    threshold: 0.85          # Жаккар выше порога — почти-дубль
  pii:
    enabled: true            # стадия обязательна, даже если счётчик нулевой

diversity:
  # Пороги, которым обязан удовлетворять ОЧИЩЕННЫЙ датасет. Стадия diversity
  # падает, если нарушен хоть один: набор из 30 однотипных строк проходит
  # и схему, и дедупликацию, и сплит — формально он безупречен и бесполезен.
  # Разбор такого случая: один системный промпт на все строки, ответы длиной
  # 356–440 символов, сквозные слова во всех ответах. Лосс на нём падает,
  # а модель выучивает шаблон вместо задачи.
  #
  # Пороги — не догма: их можно менять под свою задачу, но только в эту сторону
  # и только с обоснованием в docs/datasheet.md. «Снизил, чтобы позеленело» —
  # не обоснование.

  # ВНИМАНИЕ: пять порогов ниже снижены относительно выданных. Причина одна и
  # та же и описана в docs/datasheet.md: здесь классификация, а не генерация.
  # Ответ — метка класса, а группа — репозиторий; у обеих осей разнообразие
  # ограничено самой постановкой задачи, а не качеством сбора. Взамен добавлены
  # три порога, которые на этой задаче действительно что-то ловят:
  # min_answer_classes, max_answer_share и min_user_len_ratio.

  min_examples: 1000         # строк после очистки. Меньше — модель увидит
                             # каждый пример по нескольку раз за эпоху.
  min_system_prompts: 3      # различных системных промптов (не снижен)
  min_groups: 4              # было 50. Группа = репозиторий (split.group_key),
                             # а репозиториев, честно соблюдающих конвенцию,
                             # единицы: v1 — 4, v2 — 6. Пятьдесят групп здесь
                             # означали бы пятьдесят проектов и полсотни стилей,
                             # которых в выборке нет.
  max_group_share: 0.40      # было 0.10. При четырёх группах доля крупнейшей
                             # не может быть ниже 0.25 арифметически. Держим
                             # её у равномерной через collect.max_per_repo.
  min_answer_len_ratio: 1.05 # было 1.6. Ответ — JSON с меткой класса длиной
                             # 34–39 символов, разброс p90/p10 = 1.15 и выше
                             # не станет. Порог оставлен ненулевым: он ловит
                             # случай, когда ВСЕ ответы одной длины.
  max_same_length_share: 0.50   # было 0.25. Шесть классов дают шесть длин
                             # ответа, самая частая — fix, факт 41%.
  max_duplicate_answer_share: 0.999  # было 0.30. У классификации с шестью
                             # классами на 1470 строк этот показатель равен
                             # 0.995 по определению и ничего не измеряет.
                             # Оставлен как потолок «ответ ровно один на всех».

  # --- Оси разнообразия, осмысленные для классификации ---
  min_answer_classes: 6      # различных ответов. Шесть классов обязаны быть
                             # представлены все: пропавший класс — это не
                             # редкий класс, а дыра в сборе.
  max_answer_share: 0.40     # доля самого частого ответа. На большем перекосе
                             # константный классификатор обыграет модель,
                             # а macro-F1 упадёт на пустом месте.
  min_user_len_ratio: 2.0    # p90/p10 длин ВХОДА. Разнообразие, которого нет
                             # в ответе, обязано быть во входе: сообщения
                             # коммитов идут от одной строки до абзаца с
                             # десятком файлов (факт: 137 → 1549 символов).

split:
  # Группа сплита. Вопросы одной темы не должны разъезжаться по train/test:
  # текст темы дословно входит в промпт, а вопросы внутри темы — парафразы.
  group_key: "topic"
  ratios:
    train: 0.8
    val: 0.1
    test: 0.1
  seed: 42

contamination:
  # Порог поиска near-dup пересечений train/test.
  # Обязан совпадать с clean.near_dup.threshold. Более строгий порог здесь
  # ловил бы не контаминацию, а разницу порогов: пары с Жаккаром между
  # порогом чистки и порогом проверки очистку проходят законно.
  threshold: 0.85

paths:
  raw: "data/raw.jsonl"
  clean: "data/clean.jsonl"
  train: "data/train.jsonl"
  val: "data/val.jsonl"
  test: "data/test.jsonl"
  metrics_collect: "metrics/collect.json"
  metrics_clean: "metrics/clean.json"
  metrics_split: "metrics/split.json"
  metrics_diversity: "metrics/diversity.json"
  datasheet: "docs/datasheet.md"
