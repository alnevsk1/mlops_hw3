      size: 4588
    - path: src/config.py
      hash: md5
      md5: 21a3c6143e6777455d08acd7b576729e
      size: 1855
    params:
      params.yaml:
        collect:
          version: v2
          n_rows: 3000
          sources:
            v1:
            - sources/angular__angular.jsonl
            - sources/nestjs__nest.jsonl
            - sources/vuejs__core.jsonl
            - sources/prisma__orm.jsonl
            v2:
            - sources/angular__angular.jsonl
            - sources/nestjs__nest.jsonl
            - sources/vuejs__core.jsonl
            - sources/prisma__orm.jsonl
            - sources/nuxt__nuxt.jsonl
            - sources/vitejs__vite.jsonl
          types:
          - feat
          - fix
          - docs
          - refactor
          - test
          - chore
          drop_merges: true
          drop_bots: true
          drop_reverts: true
          drop_release: true
          max_files: 10
          max_body_chars: 1200
          max_per_class_per_repo: 150
          max_per_repo: 500
          system_prompts:
          - 'You classify git commits by Conventional Commits type. Given the commit
            message (prefix removed) and the list of changed files, answer with a
            JSON object: {"type": one of feat|fix|docs|refactor|test|chore, "breaking":
            true or false}. Answer with JSON only.'
          - Определи тип коммита по соглашению Conventional Commits. На входе — 
            сообщение без префикса и список изменённых файлов. Ответь ровно 
            одним JSON-объектом с полями type (feat, fix, docs, refactor, test 
            или chore) и breaking (true или false). Ничего, кроме JSON.
          - 'Task: commit type classification. You get a commit message with its type
            prefix stripped, plus changed files with line statistics. Return only
            JSON: {"type": "...", "breaking": ...}. Allowed types: feat, fix, docs,
            refactor, test, chore.'
          - Ты размечаешь историю репозитория. По тексту коммита и списку файлов
            выбери один тип из feat, fix, docs, refactor, test, chore и укажи, 
            является ли изменение breaking change. Формат ответа — JSON с 
            ключами type и breaking, без пояснений.
          - 'Read the commit message and the changed files, then decide which Conventional
            Commits type it belongs to and whether it breaks the public API. Reply
            with a single JSON object {"type": ..., "breaking": ...} and nothing else.'
        paths.raw: data/raw.jsonl
    outs:
    - path: data/raw.jsonl
      hash: md5
      md5: 25326eec145f62d47237f1bbfe8802d4
      size: 2671932
    - path: metrics/collect.json
      hash: md5
      md5: 86890186dcce727fa13d966bcc1de6bd
      size: 1693
