# Пайплайн ДЗ 3: collect → clean → diversity → split.
#
# Два правила, из-за нарушения которых пайплайн «не пересчитывается»:
#   deps — всё, от чего зависит результат: входные данные И код стадии;
#   params — секции params.yaml, при изменении которых стадия обязана
#            переисполниться (пути к источникам живут там, а не в deps).
# Пути в outs дублируют paths.* из params.yaml: dvc.yaml не умеет читать
# params, поэтому согласованность проверяется в tests/check.sh.

stages:
  collect:
    cmd: python -m src.collect
    deps:
      # Кэш выгрузки GitHub: источник стадии. Без него dvc не заметит, что
      # данные изменились, и не пересчитает collect.
      - sources
      - src/collect.py
      - src/commits.py
      - src/config.py
    params:
      # Секция целиком: здесь живёт collect.version, а версия данных обязана
      # инвалидировать стадию — иначе после смены версии repro говорит,
      # что пересчитывать нечего, и артефакты остаются от прошлой версии.
      - collect
      - paths.raw
    outs:
      - data/raw.jsonl
    metrics:
      - metrics/collect.json:
          cache: false

  clean:
    cmd: python -m src.clean
    deps:
      # Выход collect: без него ребро collect -> clean в графе отсутствует,
      # и новая версия raw.jsonl не пересчитывает очистку.
      - data/raw.jsonl
      - src/clean.py
      - src/dedup.py
      - src/pii.py
      - src/schema.py
      - src/stats.py
      - src/textnorm.py
      - src/config.py
    params:
      - clean
      - paths.clean
    outs:
      - data/clean.jsonl
    metrics:
      - metrics/clean.json:
          cache: false

  diversity:
    cmd: python -m src.diversity
    deps:
      - data/clean.jsonl
      - src/diversity.py
      - src/stats.py
      - src/schema.py
      - src/textnorm.py
      - src/config.py
    params:
      - diversity
      - split.group_key
      - paths.clean
    metrics:
      - metrics/diversity.json:
          cache: false

  split:
    cmd: python -m src.split
    deps:
      - data/clean.jsonl
      - src/split.py
      - src/contamination.py
      - src/dedup.py
      - src/schema.py
      - src/textnorm.py
      - src/config.py
    params:
      - split
      - contamination
      - paths.train
      - paths.val
      - paths.test
    outs:
      # Все три сплита, а не только train: невыгруженный test — это test,
      # которого у соседа не будет, и сравнивать метрики будет не с чем.
      - data/train.jsonl
      - data/val.jsonl
      - data/test.jsonl
    metrics:
      - metrics/split.json:
          cache: false
